<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#000000" />
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230a0810'/%3E%3Cpath d='M16 4l1.7 4.6L22.3 10l-4.6 1.4L16 16l-1.7-4.6L9.7 10l4.6-1.4z' fill='%23e9c9a2'/%3E%3Cpath d='M16 12l4.2 7.5H11.8z' fill='%23f6e7ee'/%3E%3Cpath d='M16 16l4.2 7.5H11.8z' fill='%23e4c3d4' opacity='.55'/%3E%3Crect x='14.7' y='19' width='2.6' height='6' rx='1' fill='%23c9a888'/%3E%3C/svg%3E" />
<title>Christmas Stars · 圣诞星辰</title>
<style>:root{--ink: #f4ece2;--ink-dim: rgba(244, 236, 226, .62);--ink-faint: rgba(244, 236, 226, .34);--gold: #e9c9a2;--rose: #f0bfcd;--ice: #b9c9e8;--panel: rgba(14, 12, 18, .46);--panel-solid: rgba(10, 9, 13, .72);--line: rgba(255, 226, 208, .14);--line-strong: rgba(255, 226, 208, .3);--shadow: 0 18px 50px rgba(0, 0, 0, .55);--font-display: "Cormorant Garamond", "Optima", "Palatino Linotype", "Songti SC", Georgia, "Times New Roman", serif;--font-ui: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;--ease: cubic-bezier(.22, .61, .36, 1)}*{box-sizing:border-box}html,body{margin:0;padding:0;height:100%;background:#000;overflow:hidden;color:var(--ink);font-family:var(--font-ui);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}#app{position:fixed;inset:0}#stage{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}#stage.is-dragging{cursor:grabbing}#stage.is-hot{cursor:pointer}.fx-vignette{position:absolute;inset:0;pointer-events:none;z-index:2;background:radial-gradient(120% 92% at 50% 46%,#0000 42%,#0000008c),radial-gradient(60% 40% at 22% 40%,rgba(120,150,220,.06),transparent 70%);mix-blend-mode:normal}.fx-grain{position:absolute;inset:-20%;pointer-events:none;z-index:3;opacity:.16;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='160' height='160' filter='url(%23n)' opacity='0.55'/></svg>");animation:grain 6s steps(6) infinite}@keyframes grain{0%,to{transform:translateZ(0)}20%{transform:translate3d(-2%,1%,0)}40%{transform:translate3d(1%,-2%,0)}60%{transform:translate3d(-1%,-1%,0)}80%{transform:translate3d(2%,1%,0)}}.brand{position:absolute;z-index:6;top:26px;left:32px;display:flex;align-items:center;gap:11px;opacity:0;transform:translateY(-8px);pointer-events:none;transition:opacity 1.1s var(--ease) .5s,transform 1.1s var(--ease) .5s}.ready .brand{opacity:1;transform:none}.brand-mark{width:22px;height:22px;display:block;filter:drop-shadow(0 0 8px rgba(233,201,162,.55))}.brand-mark svg{width:100%;height:100%;fill:var(--gold)}.brand-text{display:flex;flex-direction:column;line-height:1;letter-spacing:.34em}.brand-text b{font-size:11px;font-weight:600;color:var(--ink)}.brand-text i{font-size:9px;font-style:normal;letter-spacing:.5em;color:var(--ink-faint);margin-top:5px}.greeting{position:absolute;z-index:6;left:clamp(24px,6vw,104px);top:50%;transform:translateY(-58%);max-width:min(56vw,720px);opacity:0;pointer-events:none;transition:opacity 1.4s var(--ease) .75s}.ready .greeting{opacity:1}.greeting.dim{opacity:.12;transition:opacity .9s var(--ease)}.greeting-title{margin:0 0 18px;font-family:var(--font-display);font-style:italic;font-weight:500;font-size:clamp(30px,4.4vw,68px);line-height:1.02;letter-spacing:.012em;white-space:nowrap;color:#f7efe2;text-shadow:0 0 28px rgba(255,228,196,.22),0 2px 40px rgba(0,0,0,.6)}.greeting-row{display:flex;align-items:center;gap:clamp(16px,2vw,30px)}.moon{width:clamp(74px,9vw,120px);height:clamp(74px,9vw,120px);flex:none;filter:drop-shadow(0 0 22px rgba(176,204,255,.5)) drop-shadow(0 0 60px rgba(140,170,235,.28));animation:moonBreath 6.5s ease-in-out infinite}@keyframes moonBreath{0%,to{filter:drop-shadow(0 0 20px rgba(176,204,255,.42)) drop-shadow(0 0 54px rgba(140,170,235,.22))}50%{filter:drop-shadow(0 0 30px rgba(176,204,255,.62)) drop-shadow(0 0 78px rgba(140,170,235,.34))}}.greeting-sub{margin:0;font-size:clamp(12px,1.15vw,15px);line-height:1.9;color:var(--ink-dim);letter-spacing:.12em;font-weight:300}.greeting-tag{display:block;margin-top:14px;font-size:9.5px;letter-spacing:.42em;color:var(--ink-faint);padding-top:12px;border-top:1px solid var(--line)}.info-card{position:absolute;z-index:7;left:clamp(28px,7vw,116px);bottom:40px;width:min(320px,calc(100vw - 56px));padding:16px 18px 14px;background:var(--panel);border:1px solid var(--line);border-radius:14px;backdrop-filter:blur(14px) saturate(1.2);-webkit-backdrop-filter:blur(14px) saturate(1.2);box-shadow:var(--shadow);opacity:0;visibility:hidden;pointer-events:none;transform:translateY(14px) scale(.985);transition:opacity .75s var(--ease),transform .75s var(--ease),visibility 0s linear .75s}.info-card.show{opacity:1;visibility:visible;transform:none;transition-delay:0s}.info-head{display:flex;align-items:center;gap:9px;margin-bottom:13px}.info-dot{width:7px;height:7px;border-radius:50%;background:var(--gold);flex:none;box-shadow:0 0 10px var(--gold);animation:pulse 2.2s ease-in-out infinite}@keyframes pulse{0%,to{opacity:1;transform:scale(1)}50%{opacity:.45;transform:scale(.72)}}.info-title{font-family:var(--font-display);font-size:19px;letter-spacing:.06em;color:#f8f0e4;flex:1}.info-close{width:24px;height:24px;border-radius:50%;border:1px solid var(--line);background:transparent;color:var(--ink-dim);cursor:pointer;display:grid;place-items:center;transition:all .25s var(--ease);padding:0;pointer-events:auto}.info-close svg{width:12px;height:12px}.info-close:hover{color:var(--ink);border-color:var(--line-strong);background:#ffffff0f}.info-grid{margin:0;display:grid;grid-template-columns:auto 1fr;gap:8px 16px;font-size:11.5px}.info-grid dt{color:var(--ink-faint);letter-spacing:.08em;white-space:nowrap}.info-grid dd{margin:0;color:var(--ink);font-variant-numeric:tabular-nums;letter-spacing:.04em}.info-note{margin:13px 0 0;padding-top:11px;border-top:1px solid var(--line);font-size:10.5px;color:var(--ink-faint);letter-spacing:.06em}.hint{position:absolute;z-index:6;top:30px;right:32px;display:flex;align-items:center;gap:9px;padding:9px 16px;border-radius:999px;background:var(--panel);border:1px solid var(--line);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);font-size:11px;letter-spacing:.1em;color:var(--ink-dim);opacity:0;transform:translateY(-10px);pointer-events:none;transition:opacity 1s var(--ease) 1s,transform 1s var(--ease) 1s}.ready .hint{opacity:1;transform:none}.hint.gone{opacity:0!important;transform:translateY(-10px)!important;transition-delay:0s}.hint b{color:var(--gold);font-weight:500}.hint-dot{width:5px;height:5px;border-radius:50%;background:var(--gold);box-shadow:0 0 8px var(--gold)}.toolbar{position:absolute;z-index:7;right:30px;bottom:32px;display:flex;flex-direction:column;align-items:center;gap:8px;padding:10px 9px;border-radius:18px;background:var(--panel);border:1px solid var(--line);backdrop-filter:blur(16px) saturate(1.2);-webkit-backdrop-filter:blur(16px) saturate(1.2);box-shadow:var(--shadow);opacity:0;transform:translate(14px);transition:opacity 1s var(--ease) .95s,transform 1s var(--ease) .95s}.ready .toolbar{opacity:1;transform:none}.tool{position:relative;width:36px;height:36px;border-radius:11px;border:1px solid transparent;background:transparent;color:var(--ink-dim);display:grid;place-items:center;cursor:pointer;padding:0;transition:all .28s var(--ease)}.tool svg{width:18px;height:18px}.tool:hover{color:var(--ink);background:#ffffff12;border-color:var(--line);transform:translateY(-1px)}.tool.is-on{color:var(--gold);background:#e9c9a21a;border-color:#e9c9a238}.tool:after{content:attr(title);position:absolute;right:calc(100% + 12px);top:50%;transform:translateY(-50%) translate(6px);white-space:nowrap;font-size:10.5px;letter-spacing:.08em;color:var(--ink-dim);background:var(--panel-solid);border:1px solid var(--line);padding:5px 9px;border-radius:7px;opacity:0;pointer-events:none;transition:opacity .25s var(--ease),transform .25s var(--ease)}.tool:hover:after{opacity:1;transform:translateY(-50%) translate(0)}.tool-sep{width:20px;height:1px;background:var(--line);margin:2px 0}.fps{position:absolute;z-index:7;right:32px;top:74px;font-size:10.5px;letter-spacing:.1em;color:var(--ink-faint);font-variant-numeric:tabular-nums}.credit{position:absolute;z-index:6;left:50%;bottom:22px;transform:translate(-50%);font-size:9.5px;letter-spacing:.4em;color:#f4ece233;text-transform:uppercase;pointer-events:none}.loading{position:absolute;inset:0;z-index:20;display:grid;place-items:center;background:#000;transition:opacity 1s var(--ease),visibility 0s linear 1s}.loading.hide{opacity:0;visibility:hidden}.loading-inner{display:flex;flex-direction:column;align-items:center;gap:16px}.loading-star{width:42px;height:42px;animation:spinStar 4.5s linear infinite}.loading-star svg{width:100%;height:100%;fill:var(--gold);filter:drop-shadow(0 0 14px rgba(233,201,162,.6))}@keyframes spinStar{to{transform:rotate(360deg)}}.loading-text{margin:0;font-size:11px;letter-spacing:.46em;color:var(--ink-dim);text-indent:.46em}.loading-track{width:168px;height:1px;background:#ffffff1f;overflow:hidden}.loading-track i{display:block;height:100%;width:0%;background:linear-gradient(90deg,rgba(233,201,162,.2),var(--gold));transition:width .35s var(--ease)}.loading-pct{margin:0;font-size:9.5px;letter-spacing:.28em;color:var(--ink-faint);font-variant-numeric:tabular-nums}.noscript{position:absolute;inset:0;display:grid;place-items:center;color:var(--ink-dim);font-size:14px;letter-spacing:.1em}body.ui-hidden .brand,body.ui-hidden .greeting,body.ui-hidden .hint,body.ui-hidden .toolbar,body.ui-hidden .info-card,body.ui-hidden .credit,body.ui-hidden .fps{opacity:0!important;pointer-events:none;transition:opacity .5s var(--ease)}@media (max-width: 900px){.greeting{top:16%;transform:none;max-width:78vw}.greeting-title{margin-bottom:12px}.info-card{left:18px;right:18px;bottom:96px;width:auto}.toolbar{right:50%;transform:translate(50%);bottom:22px;flex-direction:row;border-radius:16px}.ready .toolbar{transform:translate(50%)}.tool:after{right:auto;left:50%;top:auto;bottom:calc(100% + 12px);transform:translate(-50%) translateY(6px)}.tool:hover:after{transform:translate(-50%) translateY(0)}.tool-sep{width:1px;height:20px;margin:0 2px}.brand{top:18px;left:20px}.hint{inset:auto 18px 84px;justify-content:center}.credit{display:none}}@media (max-width: 560px){.greeting-title{font-size:30px}.greeting-sub{font-size:11px}.tool{width:34px;height:34px}}@media (prefers-reduced-motion: reduce){.fx-grain,.moon,.loading-star{animation:none!important}}
</style>
</head>
<body>
<div id="app">
  <canvas id="stage"></canvas>

  <!-- 画面质感叠层 -->
  <div class="fx-vignette" aria-hidden="true"></div>
  <div class="fx-grain" aria-hidden="true"></div>

  <!-- 品牌 -->
  <header class="brand">
    <span class="brand-mark" aria-hidden="true">
      <svg viewBox="0 0 24 24"><path d="M12 2.6l2.05 5.6 5.6 2.05-5.6 2.05L12 17.9l-2.05-5.6L4.35 10.25l5.6-2.05z"/></svg>
    </span>
    <span class="brand-text"><b>CHRISTMAS</b><i>STARS</i></span>
  </header>

  <!-- 问候语 + 月亮 -->
  <section class="greeting" id="greeting">
    <h1 class="greeting-title">Merry Christmas,</h1>
    <div class="greeting-row">
      <svg class="moon" viewBox="0 0 160 160" role="img" aria-label="月亮">
        <defs>
          <radialGradient id="moonFill" cx="42%" cy="36%" r="72%">
            <stop offset="0%" stop-color="#ffffff"/>
            <stop offset="58%" stop-color="#eef2fb"/>
            <stop offset="100%" stop-color="#c3cddf"/>
          </radialGradient>
          <filter id="moonGlow" x="-70%" y="-70%" width="240%" height="240%">
            <feGaussianBlur stdDeviation="9" result="b"/>
            <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
          </filter>
          <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur stdDeviation="3.2"/>
          </filter>
        </defs>
        <circle cx="80" cy="80" r="46" fill="#cfe0ff" opacity=".38" filter="url(#soft)"/>
        <circle cx="80" cy="80" r="38" fill="url(#moonFill)"/>
        <g fill="#b9c4d6" opacity=".30">
          <ellipse cx="63" cy="62" rx="7" ry="5"/>
          <ellipse cx="96" cy="70" rx="5" ry="4"/>
          <ellipse cx="74" cy="97" rx="6" ry="4.2"/>
          <ellipse cx="101" cy="93" rx="3.4" ry="2.6"/>
        </g>
        <g stroke="#6c7689" stroke-width="3.4" stroke-linecap="round" fill="none" opacity=".78">
          <path d="M62 78c0 6 8 6 8 0"/>
          <path d="M90 78c0 6 8 6 8 0"/>
        </g>
        <path d="M74 92c2.6 3.4 9.4 3.4 12 0" stroke="#6c7689" stroke-width="3.2" stroke-linecap="round" fill="none" opacity=".78"/>
        <g fill="#f4a8b8" opacity=".45">
          <ellipse cx="55" cy="88" rx="6" ry="3.6"/>
          <ellipse cx="105" cy="88" rx="6" ry="3.6"/>
        </g>
      </svg>
      <p class="greeting-sub">
        愿每一颗星辰<br/>都照亮你今晚的梦
        <span class="greeting-tag">2026 · CHRISTMAS STARS</span>
      </p>
    </div>
  </section>

  <!-- 选中星辰的信息 -->
  <aside class="info-card" id="info" aria-live="polite">
    <div class="info-head">
      <span class="info-dot"></span>
      <span class="info-title" id="info-title">星辰 #00000</span>
      <button class="info-close" id="info-close" title="返回全景 (Esc)" aria-label="返回全景">
        <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/></svg>
      </button>
    </div>
    <dl class="info-grid" id="info-grid"></dl>
    <p class="info-note">已进入该星辰视角 · 拖拽可环绕，滚轮可继续缩放</p>
  </aside>

  <!-- 交互提示 -->
  <div class="hint" id="hint">
    <span class="hint-dot"></span>
    <span>拖拽旋转 · 滚轮缩放 · <b>点击任意星辰</b>进入它的视角</span>
  </div>

  <!-- 工具栏 -->
  <nav class="toolbar" id="toolbar" aria-label="控制面板">
    <button class="tool" data-act="reset" title="复位视角 (Space)"><svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.4-5.7M20 4v4h-4" stroke="currentColor" stroke-width="1.9" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <button class="tool" data-act="zoom-in" title="放大 (+)"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.6" stroke="currentColor" stroke-width="1.9" fill="none"/><path d="M16 16l4.4 4.4M11 8.4v5.2M8.4 11h5.2" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></svg></button>
    <button class="tool" data-act="zoom-out" title="缩小 (-)"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.6" stroke="currentColor" stroke-width="1.9" fill="none"/><path d="M16 16l4.4 4.4M8.4 11h5.2" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></svg></button>
    <span class="tool-sep"></span>
    <button class="tool is-on" data-act="snow" title="飘雪 (S)"><svg viewBox="0 0 24 24"><path d="M12 3v18M4.2 7.5l15.6 9M19.8 7.5l-15.6 9" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg></button>
    <button class="tool is-on" data-act="lines" title="星辰连线 (L)"><svg viewBox="0 0 24 24"><circle cx="6" cy="7" r="2.2" fill="currentColor"/><circle cx="18" cy="9" r="2.2" fill="currentColor"/><circle cx="10" cy="17" r="2.2" fill="currentColor"/><path d="M7.7 8.3l8.6.5M16.6 10.8l-5.2 4.7" stroke="currentColor" stroke-width="1.3"/></svg></button>
    <button class="tool" data-act="sound" title="音效 (M)"><svg viewBox="0 0 24 24"><path d="M5 9.5h3l4-3.2v11.4l-4-3.2H5z" fill="currentColor"/><path d="M15.6 9a4.2 4.2 0 0 1 0 6M18.2 6.6a7.6 7.6 0 0 1 0 10.8" stroke="currentColor" stroke-width="1.7" fill="none" stroke-linecap="round"/></svg></button>
    <button class="tool" data-act="reshuffle" title="换一片星空 (R)"><svg viewBox="0 0 24 24"><path d="M4 7h3.2c2.6 0 3.4 2 4.4 4s1.8 4 4.4 4H20M16.4 4.4L20 7l-3.6 2.6M4 17h3.2c1.5 0 2.4-1 3.2-2.4M20 17h-3.6c-1 0-1.7-.4-2.4-1.1" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <button class="tool" data-act="fullscreen" title="全屏 (F)"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 15v5h-5M20 9V4h-5M4 15v5h5" stroke="currentColor" stroke-width="1.9" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <span class="tool-sep"></span>
    <button class="tool" data-act="ui" title="隐藏界面 (H)"><svg viewBox="0 0 24 24"><path d="M2.6 12S6 5.8 12 5.8 21.4 12 21.4 12 18 18.2 12 18.2 2.6 12 2.6 12z" stroke="currentColor" stroke-width="1.7" fill="none"/><circle cx="12" cy="12" r="2.6" fill="currentColor"/></svg></button>
  </nav>

  <div class="fps" id="fps" hidden></div>

  <div class="credit">Built with Three.js</div>

  <!-- 加载层 -->
  <div class="loading" id="loading">
    <div class="loading-inner">
      <div class="loading-star" aria-hidden="true">
        <svg viewBox="0 0 48 48"><path d="M24 4l4.4 12.2L41 20.4l-12.6 4.2L24 37l-4.4-12.4L7 20.4l12.6-4.2z"/></svg>
      </div>
      <p class="loading-text">正在点亮星空</p>
      <div class="loading-track"><i id="loading-bar"></i></div>
      <p class="loading-pct" id="loading-pct">0%</p>
    </div>
  </div>
